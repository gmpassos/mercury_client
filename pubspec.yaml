name: mercury_client
description: Portable HTTP client (Browser and Native support) with memory cache and support for methods GET, HEAD, POST, PUT, DELETE, PATCH and OPTIONS.

version: 2.4.0
homepage: https://github.com/gmpassos/mercury_client

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  swiss_knife: ^3.3.14
  collection: ^1.19.1
  charset: ^2.0.1
  web: ^1.1.2
  js_interop_utils: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  stream_channel: ^2.1.4
  async: ^2.13.1
  dependency_validator: ^5.1.0
  coverage: ^1.16.0

